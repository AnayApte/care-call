<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Josh's hand tracking check</title>
  <style>
    body { font: 18px system-ui; max-width: 850px; margin: 32px auto; padding: 0 20px; background: #f4f7fa; color: #182936; }
    button, select { font: inherit; padding: 10px; margin: 4px; }
    .camera { position: relative; width: 100%; aspect-ratio: 4/3; background: #182936; }
    video, canvas { width: 100%; height: 100%; position: absolute; inset: 0; transform: scaleX(-1); }
    pre { overflow-wrap: anywhere; white-space: pre-wrap; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Hand tracking check</h1>
  <p>Assistive prototype, not a medical device. Use teammates simulating limited dexterity only.</p>
  <p>This checks Josh's camera and sample capture. It does not classify a pose or send a care request.</p>
  <button id="start">Start camera</button><button id="stop" disabled>Stop camera</button>
  <p id="status" role="status">Camera off. Start to see 21 hand points.</p>
  <div class="camera"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div>
  <p><label>Movement label <select id="label"><option>neutral</option><option>water</option><option>pain</option><option>help</option><option>bathroom</option></select></label></p>
  <button id="capture" disabled>Hold for 3 seconds</button>
  <button id="export" disabled>Download captured examples</button>
  <pre id="vector">No hand detected.</pre>
  <script type="module" src="./demo.ts"></script>
</body>
</html>
