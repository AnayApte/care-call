<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beacon browser beacon</title>
  <style>
    body { background: #eef3f6; color: #172d3d; font: 20px/1.5 system-ui; margin: 40px auto; max-width: 650px; padding: 20px; }
    input, button { font: inherit; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #8399aa; }
    input { width: 100%; box-sizing: border-box; }
    #beacon-word { font-size: 64px; margin: 24px 0; padding: 24px; border-radius: 12px; background: white; text-align: center; }
    button { cursor: pointer; } button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <h1>Browser beacon preview</h1>
  <p>This previews the server alert and acknowledgement. The physical caregiver Pi needs a separate test; this page does not send a device heartbeat.</p>
  <label for="beacon-server">Beacon server URL</label>
  <input id="beacon-server" type="url" value="http://127.0.0.1:8000">
  <button id="beacon-start">Start preview</button><button id="beacon-stop" disabled>Stop</button>
  <p id="beacon-word">OFF</p>
  <button id="beacon-ack" disabled>Acknowledge in browser</button>
  <p id="beacon-status" role="status">Preview off.</p>
  <p>Suspected stroke symptoms need emergency care. Acknowledging HELP does not confirm medical care.</p>
  <script type="module" src="./beaconPreview.ts"></script>
</body>
</html>
