<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding mockup A2: bottom sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body, .screen { font-family: "Figtree", system-ui, sans-serif; }
  /* The one bold thing: a tall cream sheet rising from the bottom, the feed stays clear above it. */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; background: var(--paper); border-radius: 36px 36px 0 0;
    box-shadow: 0 -30px 60px -30px rgba(0,0,0,.5); padding: 44px 72px 0 72px; display: grid; grid-template-columns: 1fr 260px; column-gap: 48px; }
  .sheet::before { content: ""; position: absolute; top: 14px; left: 50%; width: 64px; height: 6px; margin-left: -32px; border-radius: 3px; background: rgba(27,31,29,.18); }
  .sheet .step { margin: 0 0 6px; font-size: 20px; color: var(--mute); font-weight: 500; }
  .sheet .word { margin: 0 0 14px; font-size: 136px; line-height: .95; font-weight: 700; letter-spacing: -.035em; }
  .sheet .ask { margin: 0; font-size: 26px; line-height: 1.3; max-width: 30ch; }
  .sheet .ask.ok { color: var(--pine); font-weight: 600; }
  .sheet .hint { margin: 10px 0 0; color: var(--mute); font-size: 18px; }
  .sheet .side { display: grid; justify-items: center; align-content: start; gap: 18px; padding-top: 6px; }
  .hand { top: 6%; }
  .sheet .side .status { font-size: 18px; color: var(--mute); text-align: center; margin: 0; line-height: 1.35; }
  /* Ring sits half over the sheet edge, like a dial you press. */
  .dial { position: absolute; left: 50%; top: -92px; transform: translateX(-50%); width: 184px; height: 184px; border-radius: 50%; background: var(--paper); box-shadow: 0 16px 30px -14px rgba(0,0,0,.5); display: grid; place-items: center; }
  .dial .ring { width: 160px; height: 160px; }
  .dial .ring .track { stroke: var(--ring-track); stroke-width: 12; }
  .dial .ring .fill { stroke-width: 12; stroke-linecap: round; }
  .dial .ring .label { font-size: 60px; color: var(--ink); }
  .dial .ring .label.small { font-size: 20px; font-weight: 600; color: var(--pine); }
  .dial.done { background: var(--pine); }
  .dial.done svg.ck { width: 84px; height: 84px; }
  .sheet .btn { width: 100%; height: 72px; font-size: 24px; }
  .steps { display: flex; gap: 8px; position: absolute; left: 72px; bottom: 36px; }
  .steps span { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(27,31,29,.25); display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--mute); }
  .steps span.done { background: var(--pine); border-color: var(--pine); color: #fff; }
  .steps span.now { border-color: var(--ink); color: var(--ink); }
  .toast { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); background: rgba(27,31,29,.6); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 18px; backdrop-filter: blur(8px); }
  /* listening view */
  .live .sheet { height: 260px; grid-template-columns: 1fr auto; align-items: center; padding-top: 36px; }
  .live .sheet .word { font-size: 120px; }
  .live .reset { color: var(--ink); background: transparent; border-color: rgba(27,31,29,.3); }
</style>
</head>
<body>
<header class="sheet-title">
  <h1>A2: Bottom sheet</h1>
  <p>The feed stays clear at the top. A tall cream sheet rises from the bottom with the word set enormous. The ring is a dial sitting on the sheet's edge. Figtree. Feels like an intake form on a bedside tablet. <a href="index.html">All variations</a></p>
</header>
<section class="frames">

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam"><div class="window"></div><div class="room-line"></div></div>
  <div class="toast">Bring the hand into the picture</div>
  <div class="sheet">
    <div>
      <p class="step">2 of 5</p>
      <h2 class="word">Water</h2>
      <p class="ask">Ask them to make their movement for water, and hold it.</p>
      <p class="hint">Any movement they can repeat works.</p>
    </div>
    <div class="side">
      <button class="btn primary">Start</button>
      <p class="status">Counts down from 3, then records for 3 seconds.</p>
    </div>
    <div class="steps"><span class="done">✓</span><span class="now">2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
</div></div><figcaption><b>1. Waiting.</b> The dial is hidden until Start. A quiet toast at the top asks for the hand.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam"><div class="window"></div><div class="room-line"></div><svg class="hand faint"></svg></div>
  <div class="sheet">
    <div class="dial"><div class="ring"><svg viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="75"/><circle class="fill" cx="84" cy="84" r="75" style="stroke:var(--signal);stroke-dashoffset:314"/></svg><div class="label">2</div></div></div>
    <div>
      <p class="step">2 of 5</p>
      <h2 class="word">Water</h2>
      <p class="ask">Ask them to make their movement for water, and hold it.</p>
      <p class="hint">Get ready.</p>
    </div>
        <div class="steps"><span class="done">✓</span><span class="now">2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
</div></div><figcaption><b>2. Countdown.</b> The dial rises out of the sheet edge with the digit. Button is gone, nothing else to press.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam"><div class="window"></div><div class="room-line"></div><svg class="hand live"></svg></div>
  <div class="sheet">
    <div class="dial"><div class="ring"><svg viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="75"/><circle class="fill" cx="84" cy="84" r="75" style="stroke-dashoffset:190"/></svg><div class="label small">Hold still</div></div></div>
    <div>
      <p class="step">2 of 5</p>
      <h2 class="word">Water</h2>
      <p class="ask">Ask them to make their movement for water, and hold it.</p>
      <p class="hint">Hold until the dial is full. Big movements start it over.</p>
    </div>
        <div class="steps"><span class="done">✓</span><span class="now">2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
</div></div><figcaption><b>3. Holding.</b> Dial fills in pine. Landmarks go pale green.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam dim"><div class="window"></div><div class="room-line"></div><svg class="hand faint"></svg></div>
  <div class="sheet">
    <div class="dial done"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div>
      <p class="step">2 of 5</p>
      <h2 class="word">Water</h2>
      <p class="ask ok">Got it.</p>
      <p class="hint">Next: pain.</p>
    </div>
        <div class="steps"><span class="done">✓</span><span class="done">✓</span><span class="now">3</span><span>4</span><span>5</span></div>
  </div>
</div></div><figcaption><b>4. Label done.</b> Dial turns solid pine with a check and the check sound plays. The sheet's word crossfades to "Pain" a second later.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen live">
  <div class="cam"><div class="window"></div><div class="room-line"></div><svg class="hand live"></svg></div>
  <div class="sheet">
    <div class="dial"><div class="ring"><svg viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="75"/><circle class="fill" cx="84" cy="84" r="75" style="stroke-dashoffset:120"/></svg><div class="label small">Sending</div></div></div>
    <div>
      <h2 class="word">Water</h2>
      <p class="hint">Keep holding to send the request. Assistive prototype, not a medical device.</p>
    </div>
    <div class="side" style="align-content:center"><button class="btn quiet reset" style="position:static;height:56px;font-size:18px">Retrain movements</button></div>
  </div>
</div></div><figcaption><b>5. Listening.</b> Same sheet, shorter. The recognised word and trigger dial reuse the training shapes, so the handoff from onboarding feels continuous. Retrain lives in the sheet.</figcaption></figure>

</section>
<script src="hand.js"></script>
</body>
</html>
