<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding mockup A1: paper tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body, .screen { font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  /* The feed sits inside a bordered frame, like a viewfinder, on a paper-coloured page. */
  .screen { background: var(--paper-2); }
  .screen .cam { inset: 28px; border-radius: 22px; border: 3px solid rgba(27,31,29,.85); box-shadow: inset 0 0 0 2px rgba(243,239,231,.6); }
  .screen .cam.dim { filter: brightness(.72); }
  /* Deck: the current card on top, the remaining labels stacked behind it, offset upward. */
  .deck { position: absolute; left: 72px; top: 96px; width: 560px; }
  .deck { height: 372px; }
  .deck .tag { position: absolute; left: 0; top: 0; height: 372px; transform: none; }
  .deck .tag.behind { z-index: 0; transform: translateY(-14px) scale(.97); background: var(--paper-2); box-shadow: 0 10px 24px -16px rgba(0,0,0,.5); }
  .deck .tag.behind.b2 { transform: translateY(-28px) scale(.94); background: #ded7c8; }
  .deck .tag.behind.b3 { transform: translateY(-42px) scale(.91); background: #d2cbbb; }
  .deck .tag.top { z-index: 2; }
  .deck .tag.lifting { z-index: 3; transform: translateY(-330px) rotate(-4deg); opacity: .5; box-shadow: 0 40px 50px -20px rgba(0,0,0,.6); }
  .deck .tag.behind .step, .deck .tag.behind .word, .deck .tag.behind .ask, .deck .tag.behind .hint { visibility: hidden; }
  /* The one bold thing: a paper tag pinned to the feed, like a note left on the bedside. */
  .tag { position: absolute; left: 64px; top: 64px; width: 560px; padding: 40px 44px 36px; background: var(--paper); color: var(--ink);
    box-shadow: 0 24px 40px -20px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.08);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 0 100%); }
  .tag::before { content: ""; position: absolute; right: 0; top: 0; width: 28px; height: 28px; background: var(--paper-2); clip-path: polygon(0 0, 0 100%, 100% 100%); }
  .tag .step { font-size: 18px; color: var(--mute); margin: 0 0 18px; font-weight: 500; }
  .tag .word { font-size: 124px; line-height: .92; margin: 0 0 22px; font-weight: 700; letter-spacing: -.02em; font-variation-settings: "opsz" 96; }
  .tag .ask { font-size: 24px; line-height: 1.3; margin: 0; max-width: 24ch; }
  .tag .hint { font-size: 17px; color: var(--mute); margin: 18px 0 0; }
  .dock { position: absolute; left: 72px; bottom: 72px; display: flex; align-items: center; gap: 36px; }
  .ring .fill { stroke: var(--pine); stroke-width: 14; stroke-linecap: butt; }
  .ring .track { stroke: rgba(243,239,231,.35); stroke-width: 14; }
  .ring .label { color: #fff; font-size: 56px; }
  .ring .label.small { font-size: 22px; font-weight: 500; }
  .status { color: #fff; font-size: 24px; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .status small { display: block; color: rgba(255,255,255,.7); font-size: 17px; font-weight: 400; margin-top: 4px; }
  .check { width: 168px; height: 168px; border-radius: 50%; background: var(--pine); display: grid; place-items: center; }
  .check svg { width: 76px; height: 76px; }
  .rail { position: absolute; right: 72px; top: 72px; display: grid; gap: 10px; }
  .rail span { height: 6px; width: 52px; background: rgba(255,255,255,.3); border-radius: 3px; }
  .rail span.done { background: var(--pine); }
  .rail span.now { background: #fff; }
  /* listening view */
  .live .word { color: #fff; font-size: 140px; font-weight: 700; letter-spacing: -.02em; position: absolute; left: 72px; bottom: 160px; margin: 0; line-height: 1; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
  .live .sub { position: absolute; left: 74px; bottom: 110px; color: rgba(255,255,255,.75); font-size: 22px; }
  .live .ring { position: absolute; right: 88px; bottom: 88px; width: 220px; height: 220px; }
  .live .ring .label { font-size: 26px; font-weight: 500; }
</style>
</head>
<body>
<header class="sheet-title">
  <h1>A1: Paper tag</h1>
  <p>A deck of flashcards top-left: the current label on top, the remaining labels stacked behind. Finishing a label lifts the card up and off. The camera sits inside a bordered frame. Bricolage Grotesque, thick flat pine ring. <a href="index.html">All variations</a></p>
</header>
<section class="frames">

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam"><div class="window"></div><div class="room-line"></div></div>
  <div class="rail"><span class="done"></span><span class="now"></span><span></span><span></span><span></span></div>
  <div class="deck"><div class="tag behind b3"></div><div class="tag behind b2"></div><div class="tag behind b1"></div><div class="tag top">    <p class="step">2 of 5</p>
    <h2 class="word">Water</h2>
    <p class="ask">Ask them to make their movement for water, and hold it.</p>
    <p class="hint">Any movement they can repeat works.</p></div></div>
  <div class="dock">
    <button class="btn primary">Start</button>
    <p class="status">Waiting for a hand<small>Bring the hand into the picture.</small></p>
  </div>
</div></div><figcaption><b>1. Waiting.</b> The deck shows the current card on top with the remaining labels stacked behind it. The camera sits inside a bordered frame. No hand yet, so the ring is not shown and the button is the only thing to do.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam"><div class="window"></div><div class="room-line"></div><svg class="hand faint"></svg></div>
  <div class="rail"><span class="done"></span><span class="now"></span><span></span><span></span><span></span></div>
  <div class="deck"><div class="tag behind b3"></div><div class="tag behind b2"></div><div class="tag behind b1"></div><div class="tag top">    <p class="step">2 of 5</p>
    <h2 class="word">Water</h2>
    <p class="ask">Ask them to make their movement for water, and hold it.</p>
    <p class="hint">Any movement they can repeat works.</p></div></div>
  <div class="dock">
    <div class="ring"><svg viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="75"/><circle class="fill" cx="84" cy="84" r="75" style="stroke:var(--signal);stroke-dashoffset:314"/></svg><div class="label">2</div></div>
    <p class="status">Get ready<small>Recording starts in a moment.</small></p>
  </div>
</div></div><figcaption><b>2. Countdown.</b> The digit sits in the ring, in the amber signal colour so it reads as "not yet". Soft tick each second.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam"><div class="window"></div><div class="room-line"></div><svg class="hand live"></svg></div>
  <div class="rail"><span class="done"></span><span class="now"></span><span></span><span></span><span></span></div>
  <div class="deck"><div class="tag behind b3"></div><div class="tag behind b2"></div><div class="tag behind b1"></div><div class="tag top">    <p class="step">2 of 5</p>
    <h2 class="word">Water</h2>
    <p class="ask">Ask them to make their movement for water, and hold it.</p>
    <p class="hint">Hold until the ring is full.</p></div></div>
  <div class="dock">
    <div class="ring"><svg viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="75"/><circle class="fill" cx="84" cy="84" r="75" style="stroke-dashoffset:190"/></svg><div class="label small">Hold still</div></div>
    <p class="status">Recording<small>If the hand moves a lot, the ring starts over.</small></p>
  </div>
</div></div><figcaption><b>3. Holding.</b> Ring fills in pine. Landmarks turn pale green on the hand so the caregiver knows tracking is live.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen">
  <div class="cam dim"><div class="window"></div><div class="room-line"></div><svg class="hand faint"></svg></div>
  <div class="rail"><span class="done"></span><span class="done"></span><span class="now"></span><span></span><span></span></div>
  <div class="deck"><div class="tag behind b2"></div><div class="tag behind b1"></div><div class="tag top">    <p class="step">3 of 5</p>
    <h2 class="word">Pain</h2>
    <p class="ask">Ask them to make their movement for pain, and hold it.</p><div class="tag lifting">    <p class="step">2 of 5</p>
    <h2 class="word">Water</h2>
    <p class="ask" style="color:var(--pine)">Got it.</p>
    <p class="hint">Next: pain.</p></div></div></div>
  <div class="dock">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="status">Saved<small>Check sound plays. The card lifts off the deck.</small></p>
  </div>
</div></div><figcaption><b>4. Label done.</b> Ring becomes a solid pine disc with a check, and the finished card lifts up and off the deck like a flashcard, revealing the next label already underneath.</figcaption></figure>

<figure class="frame-wrap"><div class="viewport"><div class="screen live">
  <div class="cam"><div class="window"></div><div class="room-line"></div><svg class="hand live"></svg></div>
  <button class="reset">Retrain movements</button>
  <h2 class="word">Water</h2>
  <p class="sub">Keep holding to send the request.</p>
  <div class="ring"><svg viewBox="0 0 168 168"><circle class="track" cx="84" cy="84" r="75"/><circle class="fill" cx="84" cy="84" r="75" style="stroke-dashoffset:120"/></svg><div class="label" style="color:#fff">Sending</div></div>
  <p class="notice" style="left:72px;bottom:46px">Assistive prototype, not a medical device.</p>
</div></div><figcaption><b>5. Listening.</b> After the fifth label there is no summary. The recognised word is huge bottom-left, the trigger ring bottom-right, and "Retrain movements" top-right resets onboarding.</figcaption></figure>

</section>
<script src="hand.js"></script>
</body>
</html>
